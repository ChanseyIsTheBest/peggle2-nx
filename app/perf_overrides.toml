# Code generation options for speed. Root keys: they must stay outside any table.
#
# They only change how the C++ is written, so the compiler can keep guest registers in host registers instead of the
# PPCContext in memory and drop dead stores; what the guest sees is the same. The same generated code is used for the
# PC and the Switch builds, so every change here is tested on the PC first (soak runs, recordings compared with
# tools/compare_raw.py).
#
# The set measured on the console by the reference ports (nfsmw-nx docs/toolchain.md: ~14 % of the main thread was in
# __savegprlr/__restgprlr; masseffect-nx perf_overrides.toml: about -13 % instructions):
cr_as_local = true
non_volatile_as_local = true
xer_as_local = true
ctr_as_local = true
# 2026-10-07 (the user's 50-60 % CPU goal; the options sa2-nx's and futari-nx's optimised codegen ship): the lwarx
# reservation as a C++ local; skip_msr (no mfmsr/mtmsrd fences, ctx.msr stores or global lock around the guest atomic
# sequences: a stwcx. is already a compare-and-swap); dform_disp_split (D-form loads/stores as base + zext(reg) + disp:
# differs only when reg + disp crosses 2^32, a guest fault either way); fctiwz_inline (fcvtzs + NaN select).
# masseffect-nx measured skip_msr + reserved_as_local at -3.4 % total CPU.
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
# sa2-nx round 7 (its SDK change, taken 2026-10-07): no host flush-mode switch (an `msr fpcr` on AArch64, very slow on
# the A57: SA2's VMX-heavy thread spent 20-26 % of its time right after one) for floating-point moves (lfd/stfd forms,
# stfiwx, fmr, fabs, fnabs, fneg: bits only), and lfs/stfs in VMX mode convert through rex::ppc::SingleToDoubleAnyMode
# / DoubleToSingleAnyMode (the IEEE result in either mode; denormal cases on a cold path with the mode cleared).
fp_moves_modeless = true
# 2026-10-07 (the user: all of sa2-nx's CPU work): non_argument_as_local and elide_lr_stores, the rest of the diet.
#
# non_argument_as_local: r0, r2, r11, r12, f0 and v32-v63 (the volatile registers that carry no argument in the
# Xbox 360 ABI) become C++ locals too. With it a value can no longer cross a call in them, so every place where one does
# was listed with sa2-nx's audit on code generated without the option (docs/peggle2-notes.md, "non_argument_as_local"):
#   python tools/non_argument_audit.py app/generated/default --noreturn=825F7C30,825F2630,82714728,82318D20
# (longjmp, _CxxThrowException, an error exit that ends in an indirect call and never returns, and a thread exit that
# ends in ExTerminateThread: the code after a call to them belongs to other paths.)
#   - arguments in r12 read on entry: the SDK's __save*/__rest* helpers (they keep these registers in ctx by the
#     generator's rule; their calls are elided anyway), 4,273 EH/SEH funclets that are share_registers already (their
#     owners hand r12 over around the inline `bl`), the stack probe, and 177 unwind funclets of one function
#     (0x824D6028-0x824D7BA8) that the generator does not mark: nothing calls them directly, only the C++ EH dispatch
#     (_CallSettingFrame: r12 = frame, then blrl). These, the dispatch itself and the continuation jump
#     (`mr r12,r5; bctr`) keep the registers in ctx (non_argument_as_local_keep below, sa2-nx's generator option); a
#     caller hands its localized ones over around a call to them. Guest exceptions are never dispatched here (the
#     SDK's RtlRaiseException only handles SetThreadName); the path is kept exact anyway.
#   - one value returned in r11, by a __finally funclet that reloads it for its owner (share_registers: the owner's
#     copy-back takes it). 13 `subfe rX,r11,r11` read r11 after a call, but the result depends only on the carry.
#   - three functions read v57-v63 before writing them: the unaligned-load shift registers of software-pipelined
#     loops; tools/vec_shiftout.py proves no entry byte reaches a store, so zero-initialized locals give the same
#     results. (The audit's other vector reports were its own false alarm, fixed in Peggle's copy: after one run of
#     element writes, such as vlogefp128 v60, it skipped an adjacent run of another register.)
#   - no hook, native or SDK runtime code reads or writes ctx.r0/r2/r11/r12/f0/v32-v63; the setjmp callers write them
#     again before reading them after ppc_setjmp.
non_argument_as_local = true
non_argument_as_local_keep = [
  0x825F1CE4,  # the stack probe (frame size in r12)
  0x82603730,  # _CallSettingFrame (r12 = frame, blrl to the funclet)
  0x825F0AD4,  # the EH continuation jump (mr r12,r5; bctr)
  # unwind funclets of 0x824D6028-0x824D7BA8's owner, reached only through _CallSettingFrame (they read r12 on entry)
  0x824D6028, 0x824D6050, 0x824D6078, 0x824D60A0, 0x824D60C8, 0x824D60F0, 0x824D6118, 0x824D6140, 0x824D6168,
