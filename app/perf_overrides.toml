# elide_lr_stores: `ctx.lr = <return address>` is no longer stored before every call. Only hooks read ctx.lr as their
# caller, and every direct call to one of them keeps its store (lr_keep_callees, Peggle's generator option): the heap
# tracker (the allocator entry points, RtlAllocateHeap/FreeHeap/ReAllocateHeap, CreateThread) and the string-release
# check of app/src/peggle2_debug_hooks.cpp, and the throw logger (app/src/peggle2_throw_log.cpp). Their immediate
# caller stays exact; deeper frames of the heap tracker's guest stack walk (saved LRs) may now show an older return
# address, and so may the console profiler's caller attribution.
elide_lr_stores = true
lr_keep_callees = [
  0x82369B48, 0x825EEA68, 0x825EE8C0, 0x823188B0, 0x823189E8,  # operator new, malloc, free, XMemAlloc, XMemFree
  0x8231BAE0, 0x8231C3D8, 0x8231C6D0,  # RtlAllocateHeap, RtlFreeHeap, RtlReAllocateHeap
  0x82318E18,  # CreateThread
  0x822E9420,  # the string-handle release check
  0x825F2630,  # _CxxThrowException (the throw logger)
]
# 2026-10-13 (the user: sa2-nx's three CPU rounds of 2026-10-12; its SDK changes taken as a patch, docs/peggle2-notes.md):
#   - fp_compares_modeless: float compares need no host flush mode (sasrt-nx's);
#   - fp_mode_lookahead: a lookahead before each mode switch; WITHOUT the bet past a branch (sa2-nx measured that the
#     any-mode forms on a bet cost 94,000 tests a frame to save nine switches);
#   - fcti_inline: fctidz as fcvtzs + NaN select, and fctid / fctiw rounding halves to even on AArch64. A CORRECTION of
#     the Switch build: simde's portable conversion is C round(), halves away from zero (10 fctid sites in Peggle 2;
#     the PC build was always right);
#   - fp_copy_pairs: an lfs directly followed by an stfs of the same register copies the bits without a mode (only
#     where it replaces a switch for certain);
#   - div_inline: divw / divwu / divd / divdu as the host instruction with one select (a constant divisor keeps the
#     C expression).
# Not taken: rotate_word_narrow (exact, but larger code with the Switch compiler), dcbt_prefetch (no measurement),
# fp_copy_only_functions (a loss in sa2-nx).
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = false
fcti_inline = true
fp_copy_pairs = true
div_inline = true
# Left off: args_in_registers.
#
# share_registers: split pieces and funclets that read r14-r31, cr, ctr or xer before writing them must share their
# parent's registers. Found with (on code generated WITHOUT these marks):
#   python tools/read_before_write.py app/generated/default --noreturn=825F7C30,825F2630 --toml
# 0x825F7C30 is the guest longjmp (restores r14-r31/cr/lr/r1 from the jmp_buf) and 0x825F2630 _CxxThrowException:
# both noreturn. Without the second, 92 more functions show up: the code after a throw call belongs to another path.
# Do NOT mark ordinary functions (masseffect-nx: a loop-blind scan marked 61 and zeroed a caller's r27, a crash at
# startup).
#
# Result on this game (2026-10-05): 34 functions, none marked, all harmless:
#   - sub_825F7760 setjmp (mfcr reads cr1-cr7 only to store them in the jmp_buf); sub_822DD9E8 mfcr (saves the CR);
#   - sub_8260E630, sub_8260E9C0 `xor r30,r30,r30` (zero whatever r30 was); sub_822EDEC0, sub_823524E8, sub_82899100
#     `subfe rX,rX,rX` (the result depends only on the carry);
#   - sub_8231CEE4 an SEH filter funclet (`mr r8,r8` scope marker, r31 = the parent's frame): only runs while an
#     exception is dispatched, which the runtime does not do;
#   - 26 ordinary functions (normal `mflr r12` prologue, entered with `bl` or a this-adjustor `b`) at
#     0x8273xxxx-0x8281xxxx whose reads sit on paths the original only takes with the register set: the code
#     materializes a flag (li r10,1 / li r10,0) and branches on it again, and the dataflow does not track values
#     (checked by hand on sub_8273AC98). On a feasible path the original would read its caller's r14-r31, which no
#     MSVC code does; with locals it reads 0 there instead, so nothing that really executes changes.
#   (Correction, same day: sub_8231CEE4 IS a split piece; the first classification only looked for `b`/`bl` and
#   missed conditional branches. Marked below.)

[functions]
# sub_8231CEE4: the tail of sub_8231C6D0 (the game's __try { RaiseException } wrapper used for SetThreadName), entered
# with beq/bne at 0x8231C??? from the parent's body (3 conditional branches) after the __try block; reads the
# parent's frame pointer r31 (`addi r12,r31,320`, then the handler funclet sub_8231CF38 reads through r12). As a
# function of its own with r31 a local it saw 0: the PC build crashed 4.6 s after start reading guest 0x60
# (2026-10-05).
"0x8231CEE4" = { share_registers = true }
