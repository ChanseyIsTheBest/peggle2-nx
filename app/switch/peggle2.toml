# peggle2-nx settings for the Nintendo Switch - default settings: every enhancement on
# Written by tools/make_enhancement_configs.py from app/src/peggle2_enhancements.cpp: edit the table there, not this
# file. To use it: copy it to sdmc:/switch/peggle2-nx/ as peggle2.toml (the game reads only that name). The startup
# log line "[enhancements]" says which enhancements were active.

# The full game, not the trial: XBLA titles ask the console for their licence (0 would be the trial version). It
# is also the program's default when the line is missing.
license_mask = 1

# Language: "en", "de", "fr", "es", "it" or "pt" (Brazilian Portuguese). Empty = English.
peggle2_language = ""

# Pictures a second: 30 = as the Xbox 360 game (a picture every second screen refresh), 60 = a picture every refresh.
# The game runs at the same speed either way: it makes 60 logic steps a second and, with 60, draws after each one
# instead of after every second one. A picture that is not ready in time takes two steps, as with 30. With 60 the log
# has a "[fps]" line every 10 s (pictures and logic steps a second).
peggle2_fps = 30

# Local multiplayer. A second, third or fourth controller that joins a lobby is signed in as a guest of the profile,
# as on the console (false: only controller 1 can play). With the game data pack that has the PS4 content the
# lobby offers Windy and Jimmy too, in the PS4's layout of eight smaller buttons (peggle2_dlc_mp_masters = false:
# the Xbox 360's lobby of five masters).
xam_guest_signin = true
peggle2_dlc_mp_masters = true

# Single player, "Select a Master" (the screen a beaten level opens with). With the PS4 content: five masters in
# the row, Jimmy, Windy and the random button in a second row as on the PS4, and Y steps through all six costumes
# of a master (the two costume packs are the fifth and the sixth). false: the Xbox 360's screen (one row made for
# five masters, four costumes).
peggle2_dlc_master_select = true

# Controllers (up to four: the handheld Joy-Cons, Pro Controllers, Joy-Con pairs, or single Joy-Cons held sideways).
# Face buttons by position, as on the Xbox 360 pad the game was made for: the bottom button (B on Switch
# controllers) is A, the right one (A) is B, the left one (Y) is X, the top one (X) is Y. false = by letter.
input_xbox_layout = true
# Single Joy-Cons are held sideways, one per player.
input_joycon_sideways = true
# Each player's own layout: which Switch buttons press an Xbox button, as a list of A B X Y L R ZL ZR PLUS MINUS
# LSTICK RSTICK UP DOWN LEFT RIGHT SL SR, or NONE. Keys: input_p1_ to input_p4_ followed by a b x y lb rb lt rt start
# back ls rs up down left right. Empty or missing = the default above. Examples (remove the # to use one):
# input_p1_a = "B, ZR"          # player 1: B or ZR shoots
# input_p2_lb = "L, SL"         # player 2: L or SL is the left bumper
# input_p3_start = "PLUS, MINUS"

# Renderer: the native Vulkan renderer (PM4 ring -> NVK). It needs peggle2_shaders.mesp (+ .idx) next to the NRO,
# built from your own game files (tools/build_shader_library.sh). false = ReXGlue's emulated Xenos GPU: the reference
# image, but far too slow on the console.
masseffect_renderer_native = true
gpu_plugin = "xenos"

# Logs go to logs/ next to the NRO. Please keep them after a test run.
log_level = "info"

# ---- Profiler (on; not under the enhancement masters) ----
switch_profile_stacks = true                            # console CPU sampler: 1 ms stack samples into logs/rex/rex_profile.log
masseffect_gpu_marks_categories = true                  # GPU time per pass category and the idle gap ("GPU per Swap" lines)

# ---- Enhancement masters (false turns every enhancement of that group off, whatever its own key says) ----
peggle2_cpu_enhancements = true
peggle2_noncpu_enhancements = true

# ---- CPU enhancements (100) ----
masseffect_wait_blocking_ring = true                    # gpu_wait_sleep: the game's GPU busy-wait (sub_8261D378) sleeps until the ring moves; native renderer only
masseffect_native_wait_reg_mem_us = 1000                # wait_reg_mem_events: the ring's WAIT_REG_MEM parks until an interrupt, write pointer or swap (at most 1 ms); off = 50 us polling
masseffect_native_deferred_recording = false            # ring_deferred_recording: a worker records the ring's Vulkan commands (NOT pixel-identical in futari-nx's lockstep)  (EXPLICIT ONLY: off unless you set it; see the known issues)
masseffect_deferred_native_fast = false                 # ring_deferred_fast: the deferred queue is published every masseffect_deferred_native_batch commands  (EXPLICIT ONLY: off unless you set it; see the known issues)
masseffect_deferred_native_update = false               # ring_deferred_update: descriptor set updates are queued to the worker too  (EXPLICIT ONLY: off unless you set it; see the known issues)
masseffect_native_fingerprints_sampling = 0             # ring_fingerprint_sampling: stable textures rechecked by a sampled fingerprint (NOT exact: can miss a change)  (EXPLICIT ONLY: off unless you set it; see the known issues)
masseffect_native_upload_memory = 1                     # ring_upload_cached: the upload buffer in CPU-cached memory, flushed before each submit (SA2 console: 2x the CPU write speed)
masseffect_native_flat_identity = true                  # ring_flat_identity: shader identity lookups in a flat table (ME: 0.7-0.9 ms)
masseffect_native_fast_pair = true                      # ring_fast_pair: fast VS/PS pairing (ME: 0.5-0.7 ms)
masseffect_native_raw_microcode = true                  # ring_raw_microcode: microcode compared raw, without byte swapping (ME: 0.4-0.6 ms)
masseffect_native_pm4_fast = true                       # ring_pm4_fast: runs of constant/fetch register writes handled four words at a time with NEON (ME: 0.4-0.8 ms)
masseffect_notify_no_lock = true                        # ring_notify_no_lock: ring progress notified without taking the lock when nobody waits (ME: 0.2-0.4 ms)
masseffect_native_compare_fast = true                   # ring_compare_fast: faster state comparisons (ME: 0.5 ms)
masseffect_native_fast_copy = true                      # ring_fast_copy: vertex copies with the fast path, checked against the slow one for masseffect_native_fast_copy_verify draws
masseffect_native_fingerprint_mode = 2                  # ring_fingerprint_crc32: fingerprints with the hardware CRC32 pair on the Switch (mode 2; XXH3 mode 1 on the PC)
masseffect_native_dedupe_max_fingerprint = 16384        # ring_dedupe_large: vertex payloads up to 16 KB deduplicated by fingerprint (ME: XXH3 share of the ring 15 -> 9 %)
masseffect_native_indices_cache = true                  # ring_indices_cache: converted index buffers cached
masseffect_native_pipelines_prewarm = true              # ring_pipelines_prewarm: pipelines of earlier runs created at startup
kernel_critsec_pcr_owner = true                         # critsec_pcr_owner: critical sections take their owner from the guest context (r13 -> KPCR) instead of a thread lookup
thread_signal_skip_idle = true                          # thread_signal_skip_idle: no condition-variable notify (a syscall on Horizon) for an event or semaphore nobody is blocked on
peggle2_cpu_guest_cas_no_barrier = true                 # guest_cas_no_barrier: Compare-and-swap (the game's interlocked operations, tools/guest_cas.py, and the SDK's lock words, rex/thread/atomic.h) without the legacy builtin's trailing dmb ish on the A57; off puts the barrier back at run time
peggle2_cpu_hook_counter_shared = true                  # hook_counter_shared: Native replacements: one relaxed call counter per hook shared by all threads instead of a thread_local one (on the Switch every thread_local access is a call to __aarch64_read_tp, on every hooked call)
peggle2_cpu_hook_counter_ctx = true                     # hook_counter_ctx: Native replacements: each hook's call counter lives in the calling thread's own context (PPCContext::host_counters) instead of one counter shared by all threads: no store into a cache line every calling thread pulls to its core, and still no thread_local
peggle2_cpu_natives_smart_sync = true                   # natives_smart_sync: Native replacements: a localized copy's call writes back and reloads only the registers its callee can reach (smart sync, from sa2-nx; verify mode checks every such call) instead of all of them
peggle2_cpu_ring_vs_mismatch_memo = true                # ring_vs_mismatch_memo: Ring thread: a (library candidate, loaded VS program) pair that failed the identity check once is remembered and not compared again (both are immutable: the loaded words are named by their XXH3 and size)
peggle2_cpu_ring_identity_memo = true                   # ring_identity_memo: Ring thread: a directly paired draw with the same shader objects, object-table version and loaded VS/PS generations as the previous draw reuses its pairing and final VS/PS choice instead of running the identity checks again (both paths compared in verify mode)
peggle2_cpu_note_shader_pair = true                     # note_shader_pair: Game thread: the draw hooks skip NoteShaderObject for a VS/PS pair whose objects are both finished (two table loads instead of two calls, four times per draw counting the shader-load hook)
peggle2_api_ring_zero_ahead = true                      # api_ring_zero_ahead: Native Direct3D layer: free ring space ahead of the record head is allocated as zeroed cache lines (DC ZVA: no DRAM read before the record's stores) instead of write-prefetched; every zeroed block is checked to be free space in verify mode
peggle2_cpu_note_shader_fast = true                     # note_shader_fast: Main thread, NoteShaderObject (twice per draw): the startup diagnostic stops taking its mutex once its 32 lines are written, and finished objects are remembered in one table shared by the game threads instead of a thread_local one (no TLS lookup per call)
peggle2_cpu_ring_extent_key = true                      # ring_extent_key: Ring thread: the bounded-draw extent diagnostic dedupes on its five numbers instead of formatting a string key on every bounded draw (SA2 never fills its 32 slots, so it formatted forever)
peggle2_cpu_ring_estimator_reason = true                # ring_estimator_reason: Ring thread: the draw-extent estimator keeps its reject reason as a pointer to the literal instead of a std::string (a heap allocation per call for reasons over 15 characters)
peggle2_cpu_ring_rect_list_in_place = true              # ring_rect_list_in_place: Ring thread: a rect list of several rectangles is proven on the register file itself (the index offset set per rectangle and restored) instead of on an 80 KB copy of it
peggle2_cpu_main_thread_priority = false                # main_thread_priority: Main thread: the thread that draws runs one priority step above the other game threads (no 10 ms time-slice waits behind them)  (EXPLICIT ONLY: off unless you set it; see the known issues)
peggle2_cpu_ring_identity_accept_fast = true            # ring_identity_accept_fast: Ring thread: a VS candidate whose flat identity memo already says 'matches the loaded program' skips the mismatch memo's hash-set lookup (it can only hold pairs that did not match)
peggle2_cpu_direct_state = true                         # direct_state: Direct renderer: Direct3D's per-draw state packets become a host record the ring applies with the same register functions at the same place in the stream (one NOP packet instead of ~14 to parse; self-checked)
peggle2_cpu_direct_state_restore = true                 # direct_state_restore: Direct renderer: the ring writes the three words the marker NOP replaced back into the command buffer after applying the record, so the packets are as Direct3D wrote them (a range run twice, or a read back, sees the original PM4)
peggle2_cpu_direct_state_refs = true                    # direct_state_refs: Direct renderer: the state record lists each packet's register and where its values are in the command buffer instead of copying and byte-swapping them on the game thread; the ring reads them in place (the packets the marker overwrites are still copied)
peggle2_cpu_direct_flush = true                         # direct_flush: Direct renderer: inside a converted draw, Direct3D's flush of the shader constants, fetch constants and register groups writes the draw's record directly instead of PM4 packets the hook decodes again (one 3-word placeholder NOP in the command buffer; self-checked against the original function)
peggle2_cpu_direct_pair = true                          # direct_pair: Direct renderer: a converted draw's Draw* record rides in its state record (no queue push on the game thread, no table lookup on the ring; a submission during the call pushes it as before; checked against the table in verify mode)
peggle2_api_clears = false                              # api_clears: Native Direct3D Clear: the clear's state, shaders, vertices and draw as a record (no PM4)  (EXPLICIT ONLY: off unless you set it; see the known issues)
peggle2_api_draws = true                                # api_draws: Native Direct3D draws: BeginVertices / DrawVerticesUP (with Direct3D's draw-time state flush and shader load) and the window-scissor writer as native code that writes the ring's records directly (no PM4 for the draw)
peggle2_cpu_ring_bias_seen = true                       # ring_bias_seen: Ring thread: render-target exponent biases already logged are remembered in a small table instead of an unordered_set insert on every draw into such a target
peggle2_cpu_ring_entry_hash = true                      # ring_entry_hash: Ring thread: the vertex-input cache key reuses the ring's XXH3 of the loaded VS instead of hashing the program again on every VS change (self-checked)
peggle2_cpu_vertices_base_zero_r0 = true                # vertices_base_zero_r0: Ring and recording threads: draws whose vertex shader reads r0 also take the base-zero vertex binding (the upload buffer bound once, the draw shifted by firstVertex/vertexOffset), with the vertex index base compensated so r0 is unchanged
peggle2_cpu_ring_bound_plan_memo = true                 # ring_bound_plan_memo: Ring thread: the draw's EDRAM bound-range plan (PlanEdramBoundRanges, a pure function of its request) is reused when the request equals the previous draw's
peggle2_cpu_ring_dedupe_adaptive = true                 # ring_dedupe_adaptive: Ring thread: the vertex dedupe probes for 32 frames; with no hit it rests for 256 frames (the ranges are copied without fingerprints), then probes again
peggle2_cpu_ring_compare_uploaded = true                # ring_compare_uploaded: Ring thread: constants and shared-block change tests read the uploaded block (CPU-cached memory) instead of keeping a second copy of every upload
peggle2_cpu_lazy_trace_text = true                      # lazy_trace_text: Ring thread: format the EDRAM transfer-trace text only when a trace line is logged
peggle2_cpu_ring_target_memo = true                     # ring_target_memo: Ring thread: render target and depth target lookups answered from a small memo of their inputs (the maps never drop an entry, so the same inputs always give the same image)
peggle2_cpu_ring_redirect_key = true                    # ring_redirect_key: Ring thread: the depth-clear redirect's decline reasons are counted by number and formatted only for the report, not once per proven rectangle
peggle2_cpu_ring_edram_memo = true                      # ring_edram_memo: Ring thread: a draw with the same render-target state as the previous draw reuses its EDRAM preparation (only when the full path would do no work: same images, tiles owned in the same epoch, nothing pending; self-checked against the full path)
peggle2_cpu_native_memcpy = true                        # native_memcpy: Native CRT memcpy (sub_825F0AE0): host memcpy/memmove
peggle2_cpu_native_memset = true                        # native_memset: Native CRT memset (sub_825F10B0): host memset
peggle2_cpu_native_sub_823F5DF0 = true                  # native_sub_823F5DF0: localized copy of sub_823F5DF0: game code (4.1 % of the main thread)
