# ---- Non-CPU enhancements (24) ----
peggle2_native_edram4_clear_color0 = true               # edram4_clear_color0: a depth + color 0 clear drawn through a 4x alias is cleared in the 1x owners (no 4x draw and 4x -> 1x transfer)
peggle2_native_constants_dedupe = true                  # constants_dedupe: a new shader-constant generation with the bytes uploaded last reuses that block (no upload, no rebind)
peggle2_native_pass_narrow_end = true                   # pass_narrow_end: a render pass's end dependency names its real consumers instead of MEMORY_READ|WRITE
peggle2_native_zcull_1x_depth = false                   # zcull_1x_depth: 1x depth views keep their ZCULL plane (copy-engine stencil imports use masked stencil passes)  (EXPLICIT ONLY: off unless you set it; see the known issues)
masseffect_native_vs_relaxed_match = true               # vs_relaxed_match: vertex shaders whose fetch swizzles D3D patched are matched to the library
asset_pack = true                                       # asset_pack: game data read from game_root.nxpack instead of the folder (used anyway when only the pack exists)
peggle2_gpu_boost = true                                # boost: Handheld: ask for the official 460.8 MHz GPU profile (memory clock checked unchanged, else reverted)
peggle2_native_dedupe_sync_epochs = true                # dedupe_sync_epochs: Ring thread: the vertex dedupe and the index cache forget their recorded ranges at every GPU-to-game signal in the command stream (fence and memory writes, interrupts), the guest synchronization they were designed around (its counter was never advanced)
peggle2_gpu_lock_rechecks = true                        # lock_rechecks: The renderer reads a texture again at its next use when the game's loader has written it (or Direct3D announced a write lock of its memory); off = it waits for its recheck interval, so an atlas loaded into the previous level's memory shows the old image for up to 39 frames
peggle2_gpu_video_after_draws = true                    # video_after_draws: The game's video update (which starts the next Bink decode into the picture the frame just drew) waits until the ring thread has recorded the draws submitted so far: the picture is read before the decoder writes it (no bars and spots of half-decoded blocks in videos)
peggle2_vsync_relaxed = true                            # peggle2_vsync_relaxed: Relaxed vsync: the vblank that releases the game's flip follows its swap (at most one per 1/60 s after the previous vblank; the regular 1/60 s ticks otherwise), so a frame that misses 30 fps is shown when it is ready instead of at the next vblank: no fall from 30 straight to 20
peggle2_gpu_hd_atlases = true                           # hd_atlases: GPU: atlases from the HD pack in place of the game's 720 atlases (peggle2_hd_atlases: docked only or always); needs peggle2_hd.pack next to the program
peggle2_gpu_render_scale = true                         # render_scale: GPU: render at peggle2_render_height_handheld / peggle2_render_height_docked (720 / 1080 by default), following docked / handheld live; off = always the game's 1280x720
peggle2_native_linear_fetch_not_resolved = true         # linear_fetch_not_resolved: Renderer: a linear (untiled) texture fetch is never taken for a resolved texture (resolves write tiled layouts only): CPU data at a freed resolve's address is read from guest memory instead of being rejected (Wild Canyon's mission box centre)
peggle2_gpu_structured_cf = true                        # structured_cf: GPU: shaders whose forward-only control flow the translator proved equivalent as nested if/else run that form (SPEC_CONSTANT_STRUCTURED_CF) instead of an `if (skipTo <= pc)` test per CF instruction (needs the shader package that has it)
peggle2_gpu_push_once = true                            # push_once: GPU: the push constants (three addresses the set-4 specialized shaders never read) are recorded once per pass / command buffer instead of on every draw whose constant offsets moved (NVK: one 6-word root-table upload per draw less)
peggle2_gpu_texcoords_unswapped = true                  # texcoords_unswapped: GPU: vertex shaders skip the swapped-texcoord test of every texcoord input (a 64-bit mask test and a swizzle select per vertex): the native renderer never swaps them (g_SwappedTexcoords is always 0)
peggle2_gpu_no_texture_signs = true                     # no_texture_signs: GPU: when no texture of a draw has a signed, biased or gamma component, its pixel shader skips the per-fetch sign test (a shift, a compare and a branch per texture fetch)
peggle2_gpu_identity_remap = true                       # identity_remap: GPU: a pipeline whose vertex inputs all keep their component order (every g_InputRemap is 0xFFF) skips the per-input remap test in its vertex shader (a constant load, a compare and a branch per input)
peggle2_gpu_index_base_held = true                      # index_base_held: GPU: vertex shaders the translator proved never read the vertex index run with r0 starting at 0 (SPEC_CONSTANT_VERTEX_INDEX_UNUSED) and the per-draw vertex index base is held at 0, so draws keep the same shared constant block and set-4 binding (needs the shader package that has it)
peggle2_gpu_blend_skip = true                           # blend_skip: GPU: transparent pixels (alpha 0 or less with SRC_ALPHA / ONE_MINUS_SRC_ALPHA or additive blending, or an all-zero source with ONE / ONE_MINUS_SRC_ALPHA) are discarded before the blend when the blend would leave the RGBA8 target unchanged and nothing writes depth or stencil
peggle2_gpu_resolve_draw = true                         # resolve_draw: GPU: same-format RGBA8 color resolves are drawn on the 3D engine (one fragment pass that copies the texels) instead of vkCmdCopyImage on NVK's copy engine (no engine switch and wait for idle per resolve)
peggle2_gpu_resolve_alias = true                        # resolve_alias: GPU: a color resolve that repeats the previous one (same render target and rectangle, nothing in between) into another texture is not copied; that texture takes the bytes of the first one when something reads it or before the first one changes (a copy, or an exchange of the two images when the first one is overwritten whole). SA2's 1E8A0000 and 1F6F8000 are never read
peggle2_native_partial_resolve_inside = true            # partial_resolve_inside: Renderer: a resolve is a later rectangle of an existing resolved texture only when it declares that texture's height (or the height left below its row) and its rectangle lies inside it; a whole texture allocated a few pages above a freed one of the same size gets its own texture instead of being written into the old one
