# ReXGlue recompilation manifest for Peggle 2 (Xbox Live Arcade, title 58411436, default.xex).
#
# Run tools/codegen.ps1 (Windows): it calls `rexglue codegen peggle2_manifest.toml` and the post-codegen steps. The
# project name sets the prefix of everything generated: generated/default/peggle2_{init,pch,funcs}.h,
# peggle2_recomp.N.cpp, and the CMake target peggle2_recomp built by CMakeLists.txt.
#
# default.xex: image base 0x82000000, entry point 0x823186D0, image size 0x00DF0000, XDK 2.0.21256, original PE name
# PeggleNext360.exe. It imports only xam.xex and xboxkrnl.exe; the game has no other code module (the package holds
# default.xex, main.rsb and the achievement images, docs/plan.md).

[project]
name = "peggle2"
sdk_version = "0.10.0"
# Your own game files: the extracted XBLA package (assets/game_root, made by tools/stfs_extract.py), with default.xex
# at its root. Nothing from the game is distributed with this project.
game_root = "../assets/game_root"

[entrypoint]
file_path = "../assets/game_root/default.xex"
out_directory_path = "generated/default"

# The includes are processed before this table, so whatever is set here overrides what is included.
#   overrides.toml       written by hand: code the automatic function discovery misses, each with its evidence
#   perf_overrides.toml  code generation options for speed (registers as C++ locals, ...), turned on once the game
#                        ran (stage 5); the same generated code serves the PC and the Switch builds.
includes = ["overrides.toml", "perf_overrides.toml"]
