# Peggle 2-specific analysis corrections for the code generator.
#
# Every entry needs its evidence (which tool or which log found it). The tools that produce candidates:
#   tools/find_gaps.py, tools/gap_fixpoint.py   code the automatic discovery left without a function
#   tools/pointer_fixpoint.py                   code pointers stored in data (vtables, callback tables, CRT tables)
#   tools/switch_check.py                       jump tables the generator bounded wrongly
#   tools/runtime_gap_resolver.py               "Call to invalid or unregistered function" from a game log

# The CRT's setjmp/longjmp (root keys: they must stay outside any table). Found by shape before the first boot
# (2026-10-05, a scan of the image dump for runs of stores into r3 and the mirrored loads; tools/ppc_dis.py):
#   setjmp  0x825F7760: (a hook pointer at 0x82D990E0 is tried first: bnectr), then stfd f14-f31, std r13-r31,
#           128 VMX registers, cr at +304, lr at +308, r1 at +144, 0 at +312; returns 0
#   longjmp 0x825F7C30: the mirror image (r7 = r3): unwinds to the registration at +308/+144, lfd f14-f31,
#           ld r13-r31, VMX, mtlr/mtcrf, r1 from +144, returns r4 (1 if r4 was 0)
# 32 call sites; the image carries libpng (its error path longjmps back to png_jmpbuf), so recompiled as plain calls
# a PNG decode error would return to its caller with a foreign stack frame. With the addresses the generator emits
# host setjmp/longjmp keyed by the guest jmp_buf.
setjmp_address = 0x825F7760
longjmp_address = 0x825F7C30

[functions]
# First codegen (2026-10-05): "target not in any function". 0x823320D8 is a one-instruction function,
# `b 0x82331500` (0x82331500 = interlocked decrement of +28 = a COM-style Release; its AddRef twin is 0x823314C0).
# Both callers are this-adjustor thunks that tail-call it: 0x823346C8 `addi r3,r3,-32; b`, 0x823319D8
# `addi r3,r3,-36; b` (tools/ppc_dis.py).
"0x823320D8" = { }  # from 0x823346CC, 0x823319DC

