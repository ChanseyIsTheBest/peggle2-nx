# Rejected by tools/pointer_fixpoint.py but real entries (checked by hand with tools/ppc_dis.py, 2026-10-05). In both
# the generator had registered the continuation as a function of its own, so the entry looked like a fragment or
# did not fit its gap; a call through the pointer would stop the game ("Call to invalid or unregistered function").
#   0x825C0508: vtable entry (vtable 0x82073934: 5 of the 6 neighbouring words are registered functions). A 17-case
#     switch on a byte argument (cmplwi cr6,r8,16; table 0x825C0548) whose case labels 0x825C05B8, 05DC, 0600, 0624,
#     0660, 066C and the default 0678 the generator had made separate functions.
#   0x8275E178: qsort comparator, built at 0x827773FC (lis/addi into r6, then bl 0x825F03C8 = qsort with width 4);
#     reads only r3/r4; its tail 0x8275E1EC (subfc r11,r11,r8) had become a function that reads r8/r11 at entry.
"0x825C0508" = { }  # pointer at 0x8207394C
"0x8275E178" = { }  # built at 0x827773FC

